<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GiftedAcadem Library</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --deep:    #2C2C2A;
    --mid:     #444441;
    --mid2:    #5F5E5A;
    --muted:   #888780;
    --warm:    #B4B2A9;
    --surface: #D3D1C7;
    --near:    #F1EFE8;
    --white:   #ffffff;
    --border:  rgba(44,44,42,0.12);
    --radius:  10px;
    --radius-sm: 6px;
  }
  html { scroll-behavior: smooth; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--near); color: var(--mid); font-size: 15px; line-height: 1.6; min-height: 100vh; }

  .wordmark { font-family: Georgia, 'Times New Roman', serif; font-size: 22px; letter-spacing: -0.5px; line-height: 1; text-decoration: none; }
  .wordmark .g { font-weight: 700; font-style: italic; color: var(--deep); }
  .wordmark .a { font-weight: 400; font-style: normal; color: var(--mid); }

  nav { height: 54px; padding: 0 5%; display: flex; align-items: center; justify-content: space-between; background: var(--white); border-bottom: 0.5px solid var(--border); position: sticky; top: 0; z-index: 100; }
  .nav-right { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
  .pill { background: var(--near); border: 0.5px solid var(--warm); color: var(--mid2); padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; }

  .shell { max-width: 680px; margin: 0 auto; padding: 28px 5% 80px; }

  /* BREADCRUMB */
  .crumb { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); margin-bottom: 22px; flex-wrap: wrap; min-height: 20px; }
  .crumb-item { cursor: pointer; }
  .crumb-item:hover { color: var(--mid); }
  .crumb-item.active { color: var(--deep); font-weight: 500; cursor: default; }
  .crumb-sep { color: var(--warm); }

  .view { display: none; }
  .view.active { display: block; }

  .back-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 20px; font-family: inherit; }
  .back-btn:hover { color: var(--mid); }

  .pg-title { font-family: 'Lora', Georgia, serif; font-size: 20px; font-weight: 700; color: var(--deep); margin-bottom: 4px; letter-spacing: -0.3px; }
  .pg-sub   { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
  .sec-label { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }

  /* SEARCH */
  .search-wrap { position: relative; margin-bottom: 20px; }
  .search-wrap input { width: 100%; padding: 11px 14px; border-radius: var(--radius); border: 0.5px solid var(--warm); background: var(--white); font-size: 14px; color: var(--deep); font-family: inherit; outline: none; }
  .search-wrap input:focus { border-color: var(--mid2); box-shadow: 0 0 0 3px rgba(95,94,90,0.08); }
  .search-wrap input::placeholder { color: var(--muted); }

  /* GENERIC ROW */
  .row-list { display: flex; flex-direction: column; gap: 5px; }
  .row { background: var(--white); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 13px 16px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .row:hover { background: var(--near); border-color: var(--warm); }
  .row-left { flex: 1; }
  .row-title { font-size: 14px; font-weight: 500; color: var(--deep); }
  .row-sub   { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .row-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .row-count { font-size: 11px; color: var(--muted); }
  .row-arrow { color: var(--warm); font-size: 13px; }

  /* COUNTRY CARD (bigger, with flag) */
  .country-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .country-card { background: var(--white); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px 18px; cursor: pointer; display: flex; align-items: center; gap: 12px; }
  .country-card:hover { background: var(--near); border-color: var(--warm); }
  .c-flag { font-size: 24px; line-height: 1; flex-shrink: 0; }
  .c-info .c-name { font-size: 14px; font-weight: 600; color: var(--deep); }
  .c-info .c-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .c-badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 500; white-space: nowrap; }
  .badge-live { background: var(--near); color: var(--mid2); border: 0.5px solid var(--warm); }
  .badge-new  { background: var(--surface); color: var(--mid2); }

  /* UNIVERSITY CARD */
  .uni-list { display: flex; flex-direction: column; gap: 8px; }
  .uni-card { background: var(--white); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px 18px; cursor: pointer; display: flex; align-items: center; gap: 14px; }
  .uni-card:hover { background: var(--near); border-color: var(--warm); }
  .uni-abbr { width: 40px; height: 40px; border-radius: var(--radius-sm); background: var(--near); color: var(--mid2); font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 0.5px solid var(--warm); letter-spacing: 0.3px; text-align: center; }
  .uni-info { flex: 1; }
  .uni-info h3 { font-size: 14px; font-weight: 600; color: var(--deep); margin-bottom: 2px; }
  .uni-info p  { font-size: 11px; color: var(--muted); }
  .uni-count .n { font-family: 'Lora', Georgia, serif; font-size: 20px; font-weight: 700; color: var(--deep); text-align: right; }
  .uni-count .l { font-size: 10px; color: var(--muted); text-align: right; }

  /* YEAR ROW */
  .year-list { display: flex; flex-direction: column; gap: 5px; }
  .year-row { background: var(--white); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 13px 16px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
  .year-row:hover { background: var(--near); border-color: var(--warm); }
  .y-label { font-family: 'Lora', Georgia, serif; font-size: 16px; font-weight: 600; color: var(--deep); }
  .y-right  { display: flex; align-items: center; gap: 8px; }
  .y-meta   { font-size: 11px; color: var(--muted); }
  .tag-lock { font-size: 10px; padding: 2px 8px; border-radius: 20px; background: var(--near); color: var(--muted); border: 0.5px solid var(--warm); }

  /* PAPER CARDS */
  .paper-list { display: flex; flex-direction: column; gap: 8px; }
  .paper-card { background: var(--white); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px 18px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .p-info h3 { font-size: 14px; font-weight: 600; color: var(--deep); margin-bottom: 3px; }
  .p-info .p-meta { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .p-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .tag-exam { background: var(--near); color: var(--mid2); }
  .tag-supp { background: var(--surface); color: var(--mid2); }
  .tag-source { background: var(--near); color: var(--muted); border: 0.5px solid var(--warm); }
  .p-actions { flex-shrink: 0; }
  .btn-view { padding: 7px 16px; border-radius: var(--radius-sm); background: var(--deep); color: var(--white); font-size: 12px; font-weight: 500; border: none; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .btn-view:hover { background: var(--mid); }
  .btn-lock { padding: 7px 14px; border-radius: var(--radius-sm); background: transparent; color: var(--muted); font-size: 12px; border: 0.5px solid var(--warm); cursor: pointer; font-family: inherit; white-space: nowrap; }

  .no-results { font-size: 13px; color: var(--muted); padding: 28px 0; text-align: center; }

  /* TOOLBAR */
  #ga-toolbar { position: fixed; bottom: 20px; right: 20px; z-index: 200; display: none; flex-direction: column; gap: 6px; align-items: flex-end; }
  #ga-toolbar.show { display: flex; }
  .ga-btn { padding: 8px 15px; border-radius: 20px; font-size: 12px; font-weight: 500; border: 0.5px solid var(--warm); cursor: pointer; background: var(--white); color: var(--mid2); font-family: inherit; white-space: nowrap; }
  .ga-btn:hover { background: var(--near); }
  .ga-btn.tts-on { background: var(--deep); color: var(--white); border-color: var(--deep); }

  #tts-panel { display: none; position: fixed; bottom: 72px; right: 20px; z-index: 199; width: 272px; background: var(--white); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px; }
  #tts-panel.show { display: block; }
  #tts-panel h4 { font-size: 12px; font-weight: 600; color: var(--deep); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  #tts-now { font-size: 12px; color: var(--muted); background: var(--near); padding: 7px 9px; border-radius: var(--radius-sm); min-height: 34px; margin-bottom: 8px; line-height: 1.5; }
  .tts-row { display: flex; gap: 4px; flex-wrap: wrap; }
  .tts-btn { flex: 1; min-width: 48px; padding: 6px; font-size: 11px; border-radius: var(--radius-sm); border: 0.5px solid var(--warm); background: transparent; cursor: pointer; color: var(--mid2); font-family: inherit; }
  .tts-btn:hover { background: var(--near); }
  #tts-speed { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 11px; color: var(--muted); }
  #tts-speed input { flex: 1; }

  @media (max-width: 500px) {
    .paper-card { flex-direction: column; }
    .p-actions { width: 100%; }
    .btn-view, .btn-lock { width: 100%; text-align: center; display: block; }
    .country-list { grid-template-columns: 1fr 1fr; }
  }

  @media print {
    nav, #ga-toolbar, #tts-panel { display: none !important; }
    .view { display: block !important; }
    body { background: #fff; }
    @page { margin: 18mm 16mm; }
  }
</style>
</head>

<nav>

    </div>
    <div id="country-list"></div>
  </div>

  <!-- VIEW 2: COURSES -->
  <div class="view" id="view-courses">
    <div class="pg-title" id="courses-title"></div>
    <div class="pg-sub"   id="courses-sub"></div>
    <div class="search-wrap">
      <input type="text" id="course-search" placeholder="Search course" oninput="filterCourses(this.value)"/>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div class="sec-label" id="course-count-label" style="margin-bottom:0">All courses</div>

    </div>
    <div class="row-list" id="course-list"></div>
  </div>

  <!-- VIEW 3: UNIVERSITIES -->
  <div class="view" id="view-universities">
    <button class="back-btn" id="unis-back">Back to courses</button>
    <div class="pg-title" id="unis-title"></div>
    <div class="pg-sub"   id="unis-sub"></div>
    <div class="sec-label">Choose university</div>
    <div class="uni-list" id="uni-list"></div>
  </div>

  <!-- VIEW 4: YEARS -->
  <div class="view" id="view-years">
    <button class="back-btn" id="years-back">Back to universities</button>
    <div class="pg-title" id="years-title"></div>
    <div class="pg-sub"   id="years-sub"></div>
    <div class="sec-label">Choose year</div>
    <div class="year-list" id="year-list"></div>
  </div>

  <!-- VIEW 5: PAPERS -->
  <div class="view" id="view-papers">
    <button class="back-btn" id="papers-back">Back to years</button>
    <div class="pg-title" id="papers-title"></div>
    <div class="pg-sub"   id="papers-sub"></div>
    <div class="sec-label" style="margin-top:20px">Papers</div>
    <div class="paper-list" id="paper-list"></div>
  </div>
</div>

<!-- TOOLBAR -->
<div id="ga-toolbar">
  <button class="ga-btn" onclick="window.print()">Print</button>
  <button class="ga-btn" id="tts-btn" onclick="toggleTTS()">Listen</button>
</div>
<div id="tts-panel">
  <h4>Listen</h4>
  <div id="tts-now">Press Play to begin.</div>
  <div class="tts-row">
    <button class="tts-btn" id="tb-play"   onclick="ttsPlay()">Play</button>
    <button class="tts-btn" id="tb-pause"  onclick="ttsPause()"  style="display:none">Pause</button>
    <button class="tts-btn" id="tb-resume" onclick="ttsResume()" style="display:none">Resume</button>
    <button class="tts-btn" onclick="ttsPrev()">Prev</button>
    <button class="tts-btn" onclick="ttsNext()">Next</button>
    <button class="tts-btn" style="color:var(--muted)" onclick="ttsStop()">Stop</button>
  </div>
  <div id="tts-speed">
    <span>Speed</span>
    <input type="range" min="0.5" max="2" step="0.1" value="1" oninput="ttsRate(this.value)">
    <span id="tts-rv">1.0x</span>
  </div>
</div>

/* ── STATE ── */
let S = { country:null, course:null, uni:null };

/* ── COUNTRIES ── */
function renderCountries(q) {
  const filtered = DB.countries.filter(c =>
    !q || c.name.toLowerCase().includes(q.toLowerCase()) || c.region.toLowerCase().includes(q.toLowerCase())
  );
  const grouped = {};
  filtered.forEach(c => {
    if (!grouped[c.region]) grouped[c.region] = [];
    grouped[c.region].push(c);
  });
  let html = '';
  Object.keys(grouped).sort().forEach(region => {
    html += '<div class="sec-label" style="margin-top:16px;margin-bottom:8px">' + region + '</div>';
    html += '<div class="country-list">';
    grouped[region].forEach(c => {
      html += `<div class="country-card" onclick="pickCountry('${c.id}')">
        <span class="c-flag">${c.flag}</span>
        <div class="c-info">
          <div class="c-name">${c.name}</div>
          <div class="c-meta">${c.unis} universit${c.unis!==1?'ies':'y'}, ${c.courses} courses</div>
        </div>
      </div>`;
    });
    html += '</div>';
  });
  document.getElementById('country-list').innerHTML = html || '<div class="no-results">No countries found.</div>';
}
function filterCountries(v) { renderCountries(v); }

/* ── COURSES ── */
function pickCountry(id) {
  S.country = DB.countries.find(c => c.id === id);
  renderCourses('');
  document.getElementById('courses-title').textContent = S.country.name;
  document.getElementById('courses-sub').textContent   = S.country.note;
  document.getElementById('course-search').value = '';
  setCrumb([['Countries','countries'],[S.country.name, null]]);
  goView('courses');
}
function renderCourses(q) {
  const courses = DB.courses[S.country.id] || [];
  const filtered = courses.filter(c => !q || c.name.toLowerCase().includes(q.toLowerCase()));
  document.getElementById('course-count-label').textContent = q
    ? filtered.length + ' course' + (filtered.length!==1?'s':'') + ' found'
    : 'All courses';
  document.getElementById('course-list').innerHTML = filtered.length
    ? filtered.map(c => {
        const uniCount = c.unis.length;
        return `<div class="row" onclick="pickCourse('${c.id}')">
          <div class="row-left">
            <div class="row-title">${c.name}</div>
            <div class="row-sub">${uniCount} universit${uniCount!==1?'ies':'y'}</div>
          </div>
          <div class="row-right">
            <span class="row-arrow">&#8250;</span>
          </div>
        </div>`;
      }).join('')
    : '<div class="no-results">No courses found.</div>';
}
function filterCourses(v) { renderCourses(v); }

/* ── UNIVERSITIES ── */
function pickCourse(id) {
  S.course = (DB.courses[S.country.id]||[]).find(c => c.id === id);
  const unis = DB.universities[S.country.id] || {};
  document.getElementById('unis-title').textContent = S.course.name;
  document.getElementById('unis-sub').textContent   = S.country.name;
  document.getElementById('unis-back').onclick = () => goView('courses');
  document.getElementById('uni-list').innerHTML = S.course.unis.map(uid => {
    const u = unis[uid];
    if (!u) return '';
    return `<div class="uni-card" onclick="pickUni('${uid}')">
      <div class="uni-abbr">${uid}</div>
      <div class="uni-info">
        <h3>${u.name}</h3>
        <p>${u.full}${u.note ? ' · ' + u.note : ''}</p>
      </div>
      <div class="uni-count">
        <div class="n">${u.papers}</div>
        <div class="l">papers</div>
      </div>
    </div>`;
  }).join('');
  setCrumb([['Countries','countries'],[S.country.name,'courses'],[S.course.name, null]]);
  goView('universities');
}

/* ── YEARS ── */
function pickUni(uid) {
  const unis = DB.universities[S.country.id] || {};
  S.uni = { id: uid, ...unis[uid] };
  const key   = S.country.id + '_' + uid + '_' + S.course.id;
  const years = DB.years[key] || [2023,2022,2021];
  document.getElementById('years-title').textContent = S.course.name;
  document.getElementById('years-sub').textContent   = S.uni.name + ', ' + S.country.name;
  document.getElementById('years-back').onclick = () => goView('universities');
  document.getElementById('year-list').innerHTML = years.map(y => {
    const locked = y >= 2024;
    const hasSupp = y % 2 !== 0;
    return `<div class="year-row" onclick="pickYear(${y})">
      <span class="y-label">${y}</span>
      <div class="y-right">
        <span class="y-meta">${hasSupp ? '2 papers' : '1 paper'}</span>
        ${locked ? '<span class="tag-lock">Subscription required</span>' : ''}
        <span class="row-arrow">&#8250;</span>
      </div>
    </div>`;
  }).join('');
  setCrumb([['Countries','countries'],[S.country.name,'courses'],[S.course.name,'universities'],[S.uni.id, null]]);
  goView('years');
}

/* ── PAPERS ── */
function pickYear(year) {
  const locked = year >= 2024;
  const hasSupp = year % 2 !== 0;
  const papers = [
    { type:'End of Year Examination', tag:'exam', locked },
    ...(hasSupp ? [{ type:'Supplementary Examination', tag:'supp', locked: year >= 2023 }] : [])
  ];
  document.getElementById('papers-title').textContent = S.course.name + ', ' + year;
  document.getElementById('papers-sub').textContent   = S.uni.name + ', ' + S.country.name;
  document.getElementById('papers-back').onclick = () => goView('years');
  const sourceUrl = S.uni.url || null;
  document.getElementById('paper-list').innerHTML = papers.map(p => `
    <div class="paper-card">
      <div class="p-info">
        <h3>${p.type}</h3>
        <div class="p-meta">${S.uni.id}, ${year}, 3 hours</div>
        <div class="p-tags">
          <span class="tag ${p.tag==='supp'?'tag-supp':'tag-exam'}">${p.tag==='supp'?'Supplementary':'End of year'}</span>
          ${p.locked ? '<span class="tag tag-lock">Subscribers only</span>' : ''}
          ${sourceUrl ? '<span class="tag tag-source">Public source</span>' : ''}
        </div>
      </div>
      <div class="p-actions">
        ${p.locked
          ? '<button class="btn-lock" onclick="alert(\'Subscribe for K24.12 per month to unlock.\')">Unlock</button>'
          : '<button class="btn-view" onclick="openViewer()">View paper</button>'}
      </div>
    </div>`).join('');
  setCrumb([['Countries','countries'],[S.country.name,'courses'],[S.course.name,'universities'],[S.uni.id,'years'],[String(year), null]]);
  goView('papers');
}

function openViewer() { window.location.href = 'viewer.html'; }

/* ── NAV ── */
function goView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  window.scrollTo(0, 0);
  const toolbar = document.getElementById('ga-toolbar');
  if (name === 'papers') {
    toolbar.classList.add('show');
  } else {
    toolbar.classList.remove('show');
    ttsStop();
    document.getElementById('tts-panel').classList.remove('show');
  }
}

const viewOrder = ['countries','courses','universities','years','papers'];
function setCrumb(steps) {
  document.getElementById('crumb').innerHTML = steps.map(([label, view], i) => {
    const last = i === steps.length - 1;
    return last
      ? `<span class="crumb-item active">${label}</span>`
      : `<span class="crumb-item" onclick="goView('${view}')">${label}</span><span class="crumb-sep">&#8250;</span>`;
  }).join('');
}

/* ── TTS ── */
const synth = window.speechSynthesis;
let chunks=[], ci=0, rate=1.0, paused=false;
const hlStyle = document.createElement('style');
hlStyle.textContent = '.tts-hl { outline: 1.5px solid #5F5E5A !important; outline-offset:3px; border-radius:3px; background:rgba(95,94,90,0.07) !important; }';
document.head.appendChild(hlStyle);
function buildChunks() {
  chunks = [];
  ['.p-info h3','.p-meta','.p-tags .tag'].forEach(sel =>
    document.querySelectorAll('#view-papers ' + sel).forEach(el => {
      const t = el.innerText.trim().replace(/\s+/g,' ');
      if (t.length > 2) chunks.push({ text:t, el });
    })
  );
}
function toggleTTS() {
  const p = document.getElementById('tts-panel');
  p.classList.toggle('show');
  document.getElementById('tts-btn').classList.toggle('tts-on', p.classList.contains('show'));
  if (p.classList.contains('show')) buildChunks();
  else ttsStop();
}
function ttsSpeak(i) {
  if (i<0||i>=chunks.length){ttsStop();return;}
  ci=i; synth.cancel();
  document.querySelectorAll('.tts-hl').forEach(e=>e.classList.remove('tts-hl'));
  const c=chunks[i]; c.el.classList.add('tts-hl');
  c.el.scrollIntoView({behavior:'smooth',block:'center'});
  document.getElementById('tts-now').textContent='('+(i+1)+' of '+chunks.length+') '+c.text;
  const u=new SpeechSynthesisUtterance(c.text);
  u.rate=rate; u.lang='en-ZA';
  u.onend=()=>{if(!paused)ttsSpeak(ci+1);};
  synth.speak(u);
  document.getElementById('tb-play').style.display='none';
  document.getElementById('tb-pause').style.display='';
  document.getElementById('tb-resume').style.display='none';
  document.getElementById('tts-btn').classList.add('tts-on');
}
function ttsPlay()   { buildChunks(); paused=false; ttsSpeak(0); }
function ttsPause()  { paused=true; synth.pause(); document.getElementById('tb-pause').style.display='none'; document.getElementById('tb-resume').style.display=''; }
function ttsResume() { paused=false; synth.resume(); document.getElementById('tb-pause').style.display=''; document.getElementById('tb-resume').style.display='none'; }
function ttsNext()   { paused=false; ttsSpeak(ci+1); }
function ttsPrev()   { paused=false; ttsSpeak(Math.max(0,ci-1)); }
function ttsStop()   {
  paused=false; synth.cancel(); chunks=[];
  document.querySelectorAll('.tts-hl').forEach(e=>e.classList.remove('tts-hl'));
  const n=document.getElementById('tts-now'); if(n) n.textContent='Stopped. Press Play to start again.';
  const pl=document.getElementById('tb-play'); if(pl) pl.style.display='';
  const pa=document.getElementById('tb-pause'); if(pa) pa.style.display='none';
  const re=document.getElementById('tb-resume'); if(re) re.style.display='none';
  const btn=document.getElementById('tts-btn'); if(btn) btn.classList.remove('tts-on');
}
function ttsRate(v) {
  rate=parseFloat(v);
  document.getElementById('tts-rv').textContent=rate.toFixed(1)+'x';
  if(synth.speaking&&!synth.paused) ttsSpeak(ci);
}
